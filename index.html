<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iraq | Atelier High Horlogerie</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Tajawal:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-wrapper">
        
        <!-- استوديو العرض -->
        <main class="studio-viewport" id="studioViewport">
            <div class="luxury-backdrop"></div>
            
            <div class="presentation-case">
                <div class="silk-pillow"></div>
                
                <div class="watch-container" id="watchStage">
                    <svg id="watchSVG" viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <!-- خامات المعادن الواقعية -->
                            <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#cf9f38"/>
                                <stop offset="25%" stop-color="#fff5c0"/>
                                <stop offset="50%" stop-color="#a07418"/>
                                <stop offset="75%" stop-color="#f5e1a4"/>
                                <stop offset="100%" stop-color="#785309"/>
                            </linearGradient>

                            <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#abb2b9"/>
                                <stop offset="20%" stop-color="#ffffff"/>
                                <stop offset="45%" stop-color="#797d7f"/>
                                <stop offset="70%" stop-color="#d5d8dc"/>
                                <stop offset="100%" stop-color="#424949"/>
                            </linearGradient>

                            <linearGradient id="roseGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#e2a188"/>
                                <stop offset="30%" stop-color="#ffded3"/>
                                <stop offset="55%" stop-color="#b06c55"/>
                                <stop offset="80%" stop-color="#f9d0c3"/>
                                <stop offset="100%" stop-color="#6e3926"/>
                            </linearGradient>

                            <!-- خامة التيتانيوم/الأسود PVD -->
                            <linearGradient id="blackPvdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#333338"/>
                                <stop offset="40%" stop-color="#151518"/>
                                <stop offset="70%" stop-color="#28282d"/>
                                <stop offset="100%" stop-color="#09090b"/>
                            </linearGradient>

                            <!-- نقش جلد التمساح Faux Croco -->
                            <pattern id="crocoPattern" width="30" height="18" patternUnits="userSpaceOnUse">
                                <path d="M 0 0 L 30 0 L 28 18 L 2 18 Z" fill="none" stroke="rgba(0,0,0,0.4)" stroke-width="1.2"/>
                                <path d="M 8 0 L 6 18 M 15 0 L 15 18 M 23 0 L 25 18" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="0.8"/>
                            </pattern>

                            <!-- نقش Guilloché الملكي للمينا -->
                            <pattern id="guillochePattern" width="12" height="12" patternUnits="userSpaceOnUse">
                                <circle cx="6" cy="6" r="5" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>
                                <circle cx="6" cy="6" r="2.5" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="0.5"/>
                            </pattern>

                            <!-- انعكاس الكريستال الياقوتي Dynamic Glare -->
                            <linearGradient id="sapphireGlare" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
                                <stop offset="20%" stop-color="rgba(255,255,255,0.1)"/>
                                <stop offset="45%" stop-color="rgba(255,255,255,0)"/>
                                <stop offset="70%" stop-color="rgba(100,180,255,0.08)"/>
                                <stop offset="100%" stop-color="rgba(255,255,255,0.25)"/>
                            </linearGradient>

                            <!-- ظل واقعي للساعة -->
                            <filter id="realShadow" x="-30%" y="-30%" width="160%" height="160%">
                                <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
                                <feOffset dx="0" dy="25" result="offsetblur"/>
                                <feComponentTransfer>
                                    <feFuncA type="linear" slope="0.75"/>
                                </feComponentTransfer>
                                <feMerge> 
                                    <feMergeNode/>
                                    <feMergeNode in="SourceGraphic"/>
                                </feMerge>
                            </filter>
                        </defs>

                        <g id="watchGroup" filter="url(#realShadow)">
                            <g id="strapTopGroup"></g>
                            <g id="strapBottomGroup"></g>
                            <g id="caseGroup"></g>
                            <g id="bezelGroup"></g>
                            <g id="dialGroup"></g>
                            <g id="dateWindowGroup"></g>
                            <g id="numeralsGroup"></g>
                            <g id="handsGroup"></g>
                            <g id="glassReflectionGroup"></g>
                        </g>
                    </svg>
                </div>
            </div>

            <div class="studio-controls">
                <button id="zoomInBtn" title="تكبير">+</button>
                <button id="zoomOutBtn" title="تصغير">-</button>
                <button id="resetViewBtn" title="إعادة ضبط">↺</button>
            </div>
        </main>

        <!-- لوحة الإعدادات الجانبية -->
        <aside class="config-panel">
            <header class="brand-header">
                <span class="sub-title">ATELIER HIGH HORLOGERIE</span>
                <h1>IRAQI WATCHES</h1>
                <p>استوديو تخصيص الساعات السويسرية الفاخرة</p>
            </header>

            <div class="accordion-container">
                
                <!-- 1. هيكل الساعة وإطارها -->
                <section class="config-section">
                    <h3>1. العلبة الإطار (Case & Bezel)</h3>
                    <div class="option-group">
                        <label>شكل العلبة:</label>
                        <div class="button-grid" data-param="caseShape">
                            <button class="opt-btn active" data-val="round">دائري أسطوري</button>
                            <button class="opt-btn" data-val="rectangle">مستطيل ملَكي</button>
                        </div>
                    </div>
                    <div class="option-group">
                        <label>نوع الإطار (Bezel Style):</label>
                        <div class="button-grid" data-param="bezelStyle">
                            <button class="opt-btn active" data-val="smooth">إطار مصقول (Smooth)</button>
                            <button class="opt-btn" data-val="fluted">إطار مضلع (Fluted)</button>
                        </div>
                    </div>
                    <div class="option-group">
                        <label>معدن الساعة:</label>
                        <div class="color-swatches" data-param="caseMaterial">
                            <span class="swatch steel active" data-val="steel" title="ستيل 316L"></span>
                            <span class="swatch gold" data-val="gold" title="ذهب أصفر 18K"></span>
                            <span class="swatch rose-gold" data-val="rosegold" title="ذهب وردي"></span>
                            <span class="swatch black-pvd" data-val="black" title="تيتانيوم DLC أسود"></span>
                        </div>
                    </div>
                </section>

                <!-- 2. الحزام والسوار -->
                <section class="config-section">
                    <h3>2. الحزام والسوار (Strap / Bracelet)</h3>
                    <div class="option-group">
                        <label>نوع الحزام:</label>
                        <div class="button-grid" data-param="strapType">
                            <button class="opt-btn active" data-val="leather">جلد فاخر (Leather)</button>
                            <button class="opt-btn" data-val="steel">سوار معدني (Steel)</button>
                        </div>
                    </div>

                    <!-- خيارات الجلد -->
                    <div class="option-group" id="leatherOptions">
                        <label>نقشة الجلد:</label>
                        <div class="button-grid" data-param="strapTexture">
                            <button class="opt-btn active" data-val="croco">تمساح بارز (Crocodile)</button>
                            <button class="opt-btn" data-val="smooth">جلد إيطالي ناعم</button>
                        </div>
                    </div>

                    <!-- خيارات السوار المعدني -->
                    <div class="option-group" id="steelOptions" style="display: none;">
                        <label>تصميم السوار المعدني:</label>
                        <div class="button-grid" data-param="steelStyle">
                            <button class="opt-btn active" data-val="oyster">أويستر 3 وصلات (Oyster)</button>
                            <button class="opt-btn" data-val="jubilee">جوبيلي 5 وصلات (Jubilee)</button>
                        </div>
                    </div>

                    <div class="option-group">
                        <label>لون الحزام / السوار:</label>
                        <div class="color-swatches" data-param="strapColor">
                            <span class="swatch dark-leather active" data-val="#110c08" title="أسود داكن"></span>
                            <span class="swatch brown-leather" data-val="#3d1e10" title="بني ملكي"></span>
                            <span class="swatch navy-leather" data-val="#0a182e" title="كحلي ديب أوشن"></span>
                            <span class="swatch burgundy-leather" data-val="#3b0a11" title="عنابي فاخر"></span>
                        </div>
                    </div>
                </section>

                <!-- 3. المينا والتأثيرات -->
                <section class="config-section">
                    <h3>3. المينا والوجه (Dial & Texture)</h3>
                    <div class="option-group">
                        <label>لون المينا الرئيسي:</label>
                        <div class="color-swatches" data-param="dialColor">
                            <span class="swatch dial-black active" data-val="#08080a" title="أسود عقيق"></span>
                            <span class="swatch dial-white" data-val="#f4f5f7" title="أبيض عاجي"></span>
                            <span class="swatch dial-blue" data-val="#031936" title="أزرق ملكي"></span>
                            <span class="swatch dial-green" data-val="#022819" title="أخضر زمردي"></span>
                        </div>
                    </div>
                    <div class="option-group">
                        <label>نقش ونمط المينا:</label>
                        <div class="button-grid" data-param="dialPattern">
                            <button class="opt-btn active" data-val="sunburst">شعاع الشمس (Sunray)</button>
                            <button class="opt-btn" data-val="guilloche">جيلوش كلاسيكي (Guilloché)</button>
                        </div>
                    </div>
                    <div class="option-group">
                        <label>نافذة التاريخ (Date Window):</label>
                        <div class="button-grid" data-param="showDate">
                            <button class="opt-btn active" data-val="yes">تفعيل مع عدسة مكبرة</button>
                            <button class="opt-btn" data-val="no">بدون تاريخ</button>
                        </div>
                    </div>
                </section>

                <!-- 4. الأرقام والعقارب -->
                <section class="config-section">
                    <h3>4. الأرقام والعقارب (Hands & Markers)</h3>
                    <div class="option-group">
                        <label>لغة ونوع الأرقام:</label>
                        <select id="numeralLanguageSelect" class="custom-select">
                            <option value="arabic_eastern">الأرقام العربية الشرقية (١، ٢، ٣...)</option>
                            <option value="western">الأرقام الغربية (1, 2, 3...)</option>
                            <option value="roman">الأرقام الرومانية (I, II, III...)</option>
                            <option value="hindi">الأرقام الهندية/الديوناغرية (१, २, ३...)</option>
                            <option value="minimal">مؤشرات هندسية حدسية (Minimalist)</option>
                        </select>
                    </div>
                    <div class="option-group">
                        <label>شكل العقارب (Hands Design):</label>
                        <div class="button-grid" data-param="handsStyle">
                            <button class="opt-btn active" data-val="dauphine">دوفين مضلع (Dauphine)</button>
                            <button class="opt-btn" data-val="breguet">بريجيه كلاسيكي (Breguet)</button>
                        </div>
                    </div>
                    <div class="option-group">
                        <label>لون العقارب والأرقام:</label>
                        <div class="color-swatches" data-param="numeralColor">
                            <span class="swatch gold active" data-val="gold" title="ذهب"></span>
                            <span class="swatch steel" data-val="steel" title="ستيل"></span>
                            <span class="swatch rose-gold" data-val="rosegold" title="ذهب وردي"></span>
                        </div>
                    </div>
                </section>

            </div>

            <!-- التسعير والطلب -->
            <footer class="summary-footer">
                <div class="price-container">
                    <span>السعر التقديري:</span>
                    <strong id="watchPrice">$13,200</strong>
                </div>
                <button class="checkout-btn" id="orderBtn">طلب النسخة المخصصة</button>
            </footer>
        </aside>

    </div>

    <script src="app.js"></script>
</body>
</html>
